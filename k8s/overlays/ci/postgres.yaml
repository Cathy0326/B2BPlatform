# Stand-in for the managed PostgreSQL that OpenTofu creates on Linode. CI only: no volume, data dies with the pod.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: quipmarket
  labels: { app: postgres }
spec:
  replicas: 1
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      # Hardened like the app pods (Trivy KSV014/KSV118): non-root, read-only root filesystem, no capabilities.
      # Postgres writes only to the emptyDir volumes below. 70 = the "postgres" user in the alpine image.
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - { name: postgres, containerPort: 5432 }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: run, mountPath: /var/run/postgresql }
            - { name: tmp, mountPath: /tmp }
          env:
            # A subfolder, so Postgres creates and owns it (the emptyDir root itself is owned by root).
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
            - { name: POSTGRES_DB, value: quipmarket }
            - { name: POSTGRES_USER, valueFrom: { secretKeyRef: { name: backend-secrets, key: DATABASE_USER } } }
            - { name: POSTGRES_PASSWORD, valueFrom: { secretKeyRef: { name: backend-secrets, key: DATABASE_PASSWORD } } }
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "quipmarket", "-d", "quipmarket"] }
            periodSeconds: 3
          resources:
            requests: { cpu: 100m, memory: 256Mi }
      volumes:
        - { name: data, emptyDir: {} }
        - { name: run, emptyDir: {} }
        - { name: tmp, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: quipmarket
spec:
  selector: { app: postgres }
  ports:
    - { name: postgres, port: 5432, targetPort: postgres }
---
# The base denies all ingress by default; only the backend may reach the CI database.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-from-backend
  namespace: quipmarket
spec:
  podSelector:
    matchLabels: { app: postgres }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app: backend }
      ports:
        - { protocol: TCP, port: 5432 }
