apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Staging: identical to production (replicas, no demo data, Auth0 + Stripe) except for its own hosts,
# its own Auth0 tenant and Stripe test mode. Every merge to main is deployed here automatically, and the
# exact image that passed here is what a release promotes to production.
namespace: quipmarket-staging
resources:
  - ../../base
patches:
  - target: { kind: ConfigMap, name: backend-config }
    patch: |-
      - { op: replace, path: /data/CORS_ALLOWED_ORIGINS, value: "https://staging.quipmarket.example.com" }
  - target: { kind: ConfigMap, name: frontend-config }
    patch: |-
      - { op: replace, path: /data/NUXT_PUBLIC_GRAPHQL_URL, value: "https://api.staging.quipmarket.example.com/graphql" }
      - { op: replace, path: /data/NUXT_PUBLIC_AUTH0_DOMAIN, value: "your-tenant-staging.us.auth0.com" }
      - { op: replace, path: /data/NUXT_PUBLIC_AUTH0_AUDIENCE, value: "https://api.staging.quipmarket.example.com" }
  - target: { kind: Ingress, name: quipmarket }
    patch: |-
      - { op: replace, path: /spec/tls/0/hosts, value: [staging.quipmarket.example.com, api.staging.quipmarket.example.com] }
      - { op: replace, path: /spec/rules/0/host, value: staging.quipmarket.example.com }
      - { op: replace, path: /spec/rules/1/host, value: api.staging.quipmarket.example.com }
