apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: quipmarket
  labels: { app: backend }
spec:
  # 2 replicas is safe: bids lock rows, settlement claims with compare-and-set, demo seeding takes an
  # advisory lock, and subscriptions fan out across replicas through PostgreSQL LISTEN/NOTIFY.
  replicas: 2
  selector:
    matchLabels: { app: backend }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata:
      labels: { app: backend }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: backend
          image: ghcr.io/cathy0326/quipmarket-backend:latest
          ports:
            - { name: http, containerPort: 8080 }
          envFrom:
            - configMapRef: { name: backend-config }
            - secretRef: { name: backend-secrets }
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { memory: 768Mi }   # no CPU limit: avoids throttling; memory limit sizes the heap (MaxRAMPercentage)
          # Spring Boot exposes these groups automatically on Kubernetes.
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 10
            failureThreshold: 3
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 3
            failureThreshold: 40   # up to 2 minutes for Flyway migrations on first start
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }   # Tomcat needs a writable temp dir
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: quipmarket
spec:
  selector: { app: backend }
  ports:
    - { name: http, port: 8080, targetPort: http }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: backend
  namespace: quipmarket
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: backend }
