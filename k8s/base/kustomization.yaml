apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Shared by every environment; deploy through an overlay (k8s/overlays/<env>), see docs/DEPLOYMENT.md
resources:
  - namespace.yaml
  - config.yaml
  - backend.yaml
  - frontend.yaml
  - ingress.yaml
  - network-policy.yaml
images:
  - name: ghcr.io/cathy0326/quipmarket-backend
    newTag: latest
  - name: ghcr.io/cathy0326/quipmarket-frontend
    newTag: latest
