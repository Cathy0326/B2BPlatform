# Zero-trust networking inside the namespace: nothing may connect to a pod unless a rule below allows it.
# Enforced by the cluster's CNI (Calico on Linode Kubernetes Engine).
#
#   internet ─► ingress-nginx ─┬─► frontend :3000
#                              └─► backend  :8080 ◄── frontend (server-side rendering)
#
# Egress stays open on purpose: the backend must reach managed PostgreSQL (outside the cluster), Auth0 and
# Stripe, whose IP addresses change. PostgreSQL itself only accepts the cluster's IPs (OpenTofu allow_list).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: quipmarket
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: frontend-from-ingress
  namespace: quipmarket
spec:
  podSelector:
    matchLabels: { app: frontend }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: ingress-nginx }
      ports:
        - { protocol: TCP, port: 3000 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend-from-ingress-and-frontend
  namespace: quipmarket
spec:
  podSelector:
    matchLabels: { app: backend }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: ingress-nginx }
        - podSelector:
            matchLabels: { app: frontend }
      ports:
        - { protocol: TCP, port: 8080 }
