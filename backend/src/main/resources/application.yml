spring:
  application:
    name: quipmarket
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/quipmarket}
    username: ${DATABASE_USER:quipmarket}
    password: ${DATABASE_PASSWORD:quipmarket}
  flyway:
    locations: classpath:db/migration
  graphql:
    http:
      path: /graphql
    websocket:
      path: /graphql-ws
    graphiql:
      enabled: true          # browser IDE at /graphiql (disable in production)
    schema:
      printer:
        enabled: true        # GET /graphql/schema
    cors:
      # Applies to BOTH /graphql (HTTP) and /graphql-ws (WebSocket handshake origin check).
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
      allowed-methods: GET,POST
      allowed-headers: "*"

management:
  endpoints:
    web:
      exposure:
        include: health,info

---
# Demo profile: seeds inventory + auctions relative to "now", and runs rival bidder bots.
spring:
  config:
    activate:
      on-profile: demo
  flyway:
    locations: classpath:db/migration,classpath:db/demo
quipmarket:
  demo:
    bots-enabled: true
