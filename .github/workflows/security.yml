name: Security

# Every scanner uploads its full results to the repository's Security tab (code scanning).
# Only problems someone can act on fail the build: fixable HIGH/CRITICAL vulnerabilities, HIGH/CRITICAL
# misconfigurations and any committed secret. Failing on CVEs without a fix would keep CI red forever.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 6 * * 1' # Mondays: new CVEs are published even when our code does not change

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload results to the Security tab
    strategy:
      fail-fast: false
      matrix:
        language: [java-kotlin, javascript-typescript]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none            # analyses the source directly; no build needed
          queries: security-extended  # the default queries plus more security checks
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}

  trivy-repo:
    name: Trivy (dependencies, secrets, IaC)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Full report for the Security tab
        uses: aquasecurity/trivy-action@0.33.1
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          trivy-config: trivy.yaml
          format: sarif
          output: trivy-repo.sarif
          exit-code: '0'
          limit-severities-for-sarif: true
      - uses: github/codeql-action/upload-sarif@v4
        if: ${{ !cancelled() }}
        with:
          sarif_file: trivy-repo.sarif
          category: trivy-repo
      - name: Gate (fixable HIGH/CRITICAL vulnerabilities, HIGH/CRITICAL misconfigurations, secrets)
        uses: aquasecurity/trivy-action@0.33.1
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          trivy-config: trivy.yaml
          format: table
          exit-code: '1'
        env:
          TRIVY_SKIP_DB_UPDATE: 'true' # reuse the database downloaded by the first step
          TRIVY_SKIP_CHECK_UPDATE: 'true'

  trivy-images:
    name: Trivy (container images)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        app: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image (reuses the CI layer cache)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.app }}
          load: true
          tags: quipmarket-${{ matrix.app }}:scan
          cache-from: type=gha,scope=${{ matrix.app }}
      - name: Full report for the Security tab
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: quipmarket-${{ matrix.app }}:scan
          scanners: vuln
          format: sarif
          output: trivy-${{ matrix.app }}.sarif
          exit-code: '0'
      - uses: github/codeql-action/upload-sarif@v4
        if: ${{ !cancelled() }}
        with:
          sarif_file: trivy-${{ matrix.app }}.sarif
          category: trivy-image-${{ matrix.app }}
      - name: Gate (fixable CRITICAL vulnerabilities in the image)
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: quipmarket-${{ matrix.app }}:scan
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: '1'
        env:
          TRIVY_SKIP_DB_UPDATE: 'true'
          TRIVY_SKIP_CHECK_UPDATE: 'true'

  gitleaks:
    name: gitleaks (secrets in git history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the whole history: a secret deleted later is still leaked
      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks version
      - name: Scan every commit
        run: ./gitleaks git --config .gitleaks.toml --redact --no-banner --verbose .
