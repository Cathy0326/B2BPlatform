name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (typecheck, unit tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  backend:
    name: Backend (unit + Testcontainers integration tests)
    runs-on: ubuntu-latest   # has Docker, which Testcontainers needs
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: ./mvnw -B verify
      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            backend/target/surefire-reports
            backend/target/failsafe-reports

  infrastructure:
    name: Validate Kubernetes manifests and OpenTofu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: kubeconform (schema-validate k8s manifests)
        run: |
          docker run --rm -v "$PWD/k8s:/k8s" ghcr.io/yannh/kubeconform:latest \
            -strict -summary -ignore-missing-schemas -skip Kustomization /k8s
      - uses: opentofu/setup-opentofu@v1
      - name: tofu fmt + validate
        working-directory: infra
        run: |
          tofu fmt -check -recursive
          tofu init -backend=false
          tofu validate

  kubernetes:
    name: Deploy to a kind cluster + smoke test
    # Applies the production manifests (k8s/base) to a throwaway Kubernetes cluster through the CI overlay,
    # then checks the running stack end to end (k8s/overlays/ci/smoke-test.sh).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image (reuses the images job's layer cache)
        uses: docker/build-push-action@v6
        with:
          context: backend
          load: true
          tags: quipmarket-backend:ci
          cache-from: type=gha,scope=backend
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          load: true
          tags: quipmarket-frontend:ci
          cache-from: type=gha,scope=frontend
      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: quipmarket-ci
      - name: Load images into the cluster
        run: kind load docker-image quipmarket-backend:ci quipmarket-frontend:ci --name quipmarket-ci
      - name: Deploy (kubectl apply -k k8s/overlays/ci)
        run: kubectl apply -k k8s/overlays/ci
      - name: Smoke test
        run: k8s/overlays/ci/smoke-test.sh
      - name: Diagnostics
        if: failure()
        run: |
          kubectl -n quipmarket get pods -o wide
          kubectl -n quipmarket get events --sort-by=.lastTimestamp | tail -40
          kubectl -n quipmarket describe pods | tail -120
          for d in postgres backend frontend; do echo "--- $d"; kubectl -n quipmarket logs deployment/$d --tail=150 || true; done

  images:
    name: Build container images (push to GHCR on main)
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/quipmarket-${{ matrix.app }}
          tags: |
            type=sha
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.app }}
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
