name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (typecheck, unit tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint      # ESLint, zero warnings allowed
      - run: npm run test:ci   # unit tests + JUnit XML + coverage, for the quality report
      - run: npm run build
      - name: Upload test and coverage reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: frontend-reports
          path: frontend/reports

  browser:
    name: Browser tests (Playwright) + accessibility (axe)
    # User journeys and WCAG A/AA checks against the production build in demo-data mode, on a desktop and a
    # phone-sized viewport. Failures keep a trace, a screenshot and the HTML report as artifacts.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
      - name: Upload the Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: browser-reports
          path: |
            frontend/reports/playwright
            frontend/reports/e2e-junit.xml
            frontend/test-results

  backend:
    name: Backend (unit + Testcontainers integration tests)
    runs-on: ubuntu-latest   # has Docker, which Testcontainers needs
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: ./mvnw -B verify   # also writes the JaCoCo coverage report (unit + integration merged)
      # Mutation testing of the money and auction rules: fails below the threshold in pom.xml (pitest-maven).
      - run: ./mvnw -B -q org.pitest:pitest-maven:mutationCoverage
      - name: Upload test and coverage reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: backend-reports
          path: |
            backend/target/surefire-reports
            backend/target/failsafe-reports
            backend/target/site/jacoco
            backend/target/pit-reports

  quality:
    name: Quality report (pass rate, coverage, mutation score)
    # Runs even when tests fail, so the report shows WHICH tests failed and the pass rate drops.
    needs: [frontend, backend, browser]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write   # used only on main, to publish the README badge data to the "badges" branch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: frontend-reports
          path: frontend/reports
        continue-on-error: true
      - uses: actions/download-artifact@v4
        with:
          name: browser-reports
          path: frontend   # the artifact holds reports/… and test-results/…, relative to frontend/
        continue-on-error: true
      - uses: actions/download-artifact@v4
        with:
          name: backend-reports
          path: backend/target
        continue-on-error: true
      - name: Write the report to the run summary
        run: python3 scripts/quality-report.py --badges badges >> "$GITHUB_STEP_SUMMARY"
      - name: Publish badge data (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: badges
        run: |
          # An orphan branch holding only three small JSON files; force-pushed so it never grows.
          git init -q -b badges
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add . && git commit -q -m "Quality badges for ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" badges

  infrastructure:
    name: Validate Kubernetes manifests and OpenTofu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # SOPS-encrypted Secrets (*.enc.yaml) carry a `sops:` metadata block that is not part of the Secret schema;
      # the next step checks them instead (encrypted, and only there).
      - name: kubeconform (schema-validate k8s manifests)
        run: |
          docker run --rm -v "$PWD/k8s:/k8s" ghcr.io/yannh/kubeconform:latest \
            -strict -summary -ignore-missing-schemas -skip Kustomization -ignore-filename-pattern '\.enc\.yaml$' /k8s
      - name: Secrets in Git are encrypted (SOPS), and only there
        run: |
          plain=$(grep -rl --include='*.yaml' '^kind: Secret' k8s | grep -v '\.enc\.yaml$' || true)
          [ -z "$plain" ] || { echo "::error::Plain-text Secret manifests: $plain (encrypt with sops as *.enc.yaml)"; exit 1; }
          for f in $(find k8s -name '*.enc.yaml'); do
            grep -q '^sops:' "$f" || { echo "::error::$f has no SOPS metadata: it is not encrypted"; exit 1; }
            leaked=$(sed -n '/^stringData:/,/^[^ ]/p' "$f" | grep -E '^ +[A-Za-z0-9_]+: ' | grep -v 'ENC\[' || true)
            [ -z "$leaked" ] || { echo "::error::$f has unencrypted values: $(echo "$leaked" | cut -d: -f1 | xargs)"; exit 1; }
            echo "ok: $f"
          done
      - name: Render and validate every environment overlay
        run: |
          for env in dev staging prod ci; do
            echo "== $env"
            kubectl kustomize "k8s/overlays/$env" | docker run -i --rm ghcr.io/yannh/kubeconform:v0.7.0 -strict -summary
          done
      - uses: opentofu/setup-opentofu@v1
      - name: tofu fmt + validate
        working-directory: infra
        run: |
          tofu fmt -check -recursive
          tofu init -backend=false
          tofu validate

  kubernetes:
    name: Deploy to a kind cluster + smoke test
    # Applies the production manifests (k8s/base) to a throwaway Kubernetes cluster through the CI overlay,
    # then checks the running stack end to end (k8s/overlays/ci/smoke-test.sh).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image (reuses the images job's layer cache)
        uses: docker/build-push-action@v6
        with:
          context: backend
          load: true
          tags: quipmarket-backend:ci
          cache-from: type=gha,scope=backend
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          load: true
          tags: quipmarket-frontend:ci
          cache-from: type=gha,scope=frontend
      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: quipmarket-ci
      - name: Load images into the cluster
        run: kind load docker-image quipmarket-backend:ci quipmarket-frontend:ci --name quipmarket-ci
      - name: Deploy (kubectl apply -k k8s/overlays/ci)
        run: kubectl apply -k k8s/overlays/ci
      - name: Smoke test
        run: k8s/overlays/ci/smoke-test.sh
      - name: Diagnostics
        if: failure()
        run: |
          kubectl -n quipmarket get pods -o wide
          kubectl -n quipmarket get events --sort-by=.lastTimestamp | tail -40
          kubectl -n quipmarket describe pods | tail -120
          for d in postgres backend frontend; do echo "--- $d"; kubectl -n quipmarket logs deployment/$d --tail=150 || true; done

  images:
    name: Build container images (push to GHCR on main)
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/quipmarket-${{ matrix.app }}
          tags: |
            type=sha
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.app }}
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
