name: Mobile

# Kotlin Multiplatform: the shared module (money rules, rental pricing, typed GraphQL client) is tested on the
# JVM, on Android and on the iOS simulator, and the Android app is built into an installable APK.
# Runs when the mobile code changes, and also when the backend's GraphQL schema or the shared money-rule
# contract changes, because either can break the apps without touching mobile/.
on:
  push:
    branches: [main]
    paths:
      - mobile/**
      - contracts/**
      - backend/src/main/resources/graphql/**
      - .github/workflows/mobile.yml
  pull_request:
    paths:
      - mobile/**
      - contracts/**
      - backend/src/main/resources/graphql/**
      - .github/workflows/mobile.yml

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: mobile

jobs:
  android:
    name: Shared tests (JVM, Android) + Android app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4 # also validates the committed Gradle wrapper jar
      - name: Shared module tests on the JVM and on Android (contract cases included)
        run: ./gradlew --no-daemon :shared:jvmTest :shared:testDebugUnitTest
      - name: Build the Android app and run Android lint
        run: ./gradlew --no-daemon :androidApp:assembleDebug :androidApp:lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: quipmarket-android-debug-apk
          path: mobile/androidApp/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: mobile-test-reports
          path: |
            mobile/shared/build/reports/tests/
            mobile/androidApp/build/reports/lint-results-debug.html

  ios:
    name: Shared tests on the iOS simulator + XCFramework
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Shared module tests on the iOS simulator (Kotlin/Native, arm64)
        run: ./gradlew --no-daemon :shared:iosSimulatorArm64Test
      - name: Build Shared.xcframework for an iOS app (device + simulator)
        run: ./gradlew --no-daemon :shared:assembleSharedReleaseXCFramework
      - uses: actions/upload-artifact@v4
        with:
          name: Shared.xcframework
          path: mobile/shared/build/XCFrameworks/release/Shared.xcframework
