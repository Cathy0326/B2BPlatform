# Local development database. Start with:  docker compose up -d db
# (Phase 4 adds the backend and frontend services here.)
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: quipmarket
      POSTGRES_USER: quipmarket
      POSTGRES_PASSWORD: quipmarket
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quipmarket"]
      interval: 5s
      retries: 10
volumes:
  pgdata:
